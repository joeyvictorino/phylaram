name: PhylaRAM Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-portable:
    name: Portable Policy, C++20, Rust & Model Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Engineering Policy Check
        run: python3 scripts/engineering_policy_check.py

      - name: C++20 Unit Tests
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror tests/test_range_algebra.cpp -o /tmp/test_range_algebra
          /tmp/test_range_algebra
          clang++ -std=c++20 -Wall -Wextra -Werror tests/test_mock_acquire.cpp -o /tmp/test_mock_acquire
          /tmp/test_mock_acquire
          clang++ -std=c++20 -Wall -Wextra -Werror tests/test_map_json.cpp -o /tmp/test_map_json
          /tmp/test_map_json
          clang++ -std=c++20 -Wall -Wextra -Werror tests/test_cli_parser.cpp -o /tmp/test_cli_parser
          /tmp/test_cli_parser

      - name: Rust Format, Clippy & Tests
        working-directory: tools/phylaram-verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose

      - name: Forensic Interoperability Fixture Models
        run: python3 tests/test_volatility_fixture.py

      - name: Hardware & Memory Topology Models
        run: python3 tests/test_topology_matrix.py

  build-windows:
    name: Windows MSVC & KMDF Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WDK Packages
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver (Release | x64)
        run: msbuild driver\phylaram.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal /m

      - name: Test-Sign Driver Before Embedding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=PhylaRAM CI Test Signing" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(1)
          $thumbprint = $cert.Thumbprint
          "CERT_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Export-Certificate -Cert $cert -FilePath bin\PhylaRAM_TestCert.cer | Out-Null
          Import-Certificate -FilePath bin\PhylaRAM_TestCert.cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath bin\PhylaRAM_TestCert.cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          & $signtool sign /fd SHA256 /sha1 $thumbprint bin\phylaram.sys
          if ($LASTEXITCODE -ne 0) {
            throw "Driver test signing failed with exit code $LASTEXITCODE"
          }
          & $signtool verify /pa /v bin\phylaram.sys
          if ($LASTEXITCODE -ne 0) {
            throw "Driver signature verification failed with exit code $LASTEXITCODE"
          }

      - name: Build CLI (Release | x64)
        run: msbuild cli\phylaram.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal /m

      - name: Build Rust Verifier
        working-directory: tools/phylaram-verify
        run: |
          cargo build --release
          copy target\release\phylaram-verify.exe ..\..\bin\phylaram-verify.exe

      - name: Test-Sign CLI & Verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CERT_THUMBPRINT) {
            throw "CI signing certificate thumbprint is missing"
          }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          foreach ($binary in @("bin\phylaram.exe", "bin\phylaram-verify.exe")) {
            & $signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT $binary
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $binary with exit code $LASTEXITCODE"
            }
            & $signtool verify /pa /v $binary
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $binary with exit code $LASTEXITCODE"
            }
          }

      - name: Package Test Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = "dist\PhylaRAM-0.1.0-alpha-TEST-SIGNED"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item bin\phylaram.exe $destination
          Copy-Item bin\phylaram.sys $destination
          Copy-Item bin\phylaram-verify.exe $destination
          Copy-Item bin\PhylaRAM_TestCert.cer $destination
          Copy-Item scripts\install_test_cert.bat $destination
          Copy-Item README.md (Join-Path $destination "README.txt")
          Copy-Item LICENSE (Join-Path $destination "LICENSE.txt")

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhylaRAM-0.1.0-alpha-TEST-SIGNED
          path: dist/PhylaRAM-0.1.0-alpha-TEST-SIGNED/
