name: PhylaRAM Test-Signed Pre-Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Test-Signed Pre-Release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Engineering Policy Check
        shell: pwsh
        run: python scripts\engineering_policy_check.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WDK Packages
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Rust Source and Tests
        working-directory: tools/phylaram-verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose

      - name: Build Driver (Release | x64)
        run: msbuild driver\phylaram.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal /m

      - name: Create CI Test Certificate and Sign Driver Before Embedding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=PhylaRAM Release Test Signing" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(1)
          $thumbprint = $cert.Thumbprint
          "CERT_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName)
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          & $signtool sign /fd SHA256 /sha1 $thumbprint bin\phylaram.sys
          if ($LASTEXITCODE -ne 0) {
            throw "Driver test signing failed with exit code $LASTEXITCODE"
          }
          & $signtool verify /v bin\phylaram.sys
          if ($LASTEXITCODE -ne 0) {
            throw "Driver signature verification failed with exit code $LASTEXITCODE"
          }

      - name: Build CLI (Release | x64)
        run: msbuild cli\phylaram.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal /m

      - name: Build Rust Verifier
        working-directory: tools/phylaram-verify
        run: |
          cargo build --release
          copy target\release\phylaram-verify.exe ..\..\bin\phylaram-verify.exe

      - name: Test-Sign CLI & Verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CERT_THUMBPRINT) {
            throw "CI signing certificate thumbprint is missing"
          }

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName)
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          foreach ($binary in @("bin\phylaram.exe", "bin\phylaram-verify.exe")) {
            & $signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT $binary
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $binary with exit code $LASTEXITCODE"
            }
            & $signtool verify /v $binary
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $binary with exit code $LASTEXITCODE"
            }
          }

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = $tag
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Assemble Test-Signed Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.VERSION }}"
          $directoryName = "PhylaRAM-$version-x64-TEST-SIGNED"
          $destination = Join-Path "dist" $directoryName
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Copy-Item bin\phylaram.exe $destination
          Copy-Item bin\phylaram.sys $destination
          Copy-Item bin\phylaram-verify.exe $destination
          Copy-Item bin\PhylaRAM_TestCert.cer $destination
          Copy-Item scripts\install_test_cert.bat $destination
          Copy-Item README.md (Join-Path $destination "README.txt")
          Copy-Item LICENSE (Join-Path $destination "LICENSE.txt")

          $zip = "$directoryName.zip"
          Compress-Archive -Path "$destination\*" -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding Ascii

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhylaRAM-${{ steps.version.outputs.VERSION }}-x64-TEST-SIGNED.zip
            PhylaRAM-${{ steps.version.outputs.VERSION }}-x64-TEST-SIGNED.zip.sha256
          draft: false
          prerelease: true
          name: PhylaRAM ${{ github.ref_name }} (test-signed alpha)
          body: |
            ## Test-signed alpha artifact

            This is **not a production-signed release**. The kernel driver is signed with a CI-generated self-signed test certificate for use in a dedicated test environment.

            Do not weaken Secure Boot, HVCI/Memory Integrity, or other security controls on a real evidence host merely to load this alpha artifact.

            Production Microsoft driver signing, Driver Verifier stress, physical-hardware topology coverage, and real forensic-tool interoperability remain separate release gates. See `docs/STATUS.md` and `docs/DRIVER_SIGNING_AND_HVCI.md`.
