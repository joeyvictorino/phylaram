name: PhylaRAM Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WDK (NuGet)
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver (Release | x64)
        run: msbuild driver\phylaram.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal /m

      - name: Build CLI (Release | x64)
        run: msbuild cli\phylaram.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal /m

      - name: Build Rust Verifier
        working-directory: tools/phylaram-verify
        run: |
          cargo build --release
          copy target\release\phylaram-verify.exe ..\..\bin\phylaram-verify.exe

      - name: Test-Sign Binaries
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=PhylaRAM Test Signing" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(1)
          $thumbprint = $cert.Thumbprint

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if ($signtool) {
            & $signtool sign /fd SHA256 /sha1 $thumbprint /tr http://timestamp.digicert.com /td SHA256 bin\phylaram.sys 2>&1
            & $signtool sign /fd SHA256 /sha1 $thumbprint /tr http://timestamp.digicert.com /td SHA256 bin\phylaram.exe 2>&1
          }

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') { $ver = $Matches[1] } else { $ver = $tag }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Assemble Release Bundle
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $dir = "PhylaRAM-${ver}-x64-TEST-SIGNED"
          mkdir dist\$dir
          copy bin\phylaram.exe dist\$dir\
          copy bin\phylaram.sys dist\$dir\
          copy bin\phylaram-verify.exe dist\$dir\
          copy README.md dist\$dir\README.txt
          copy LICENSE dist\$dir\LICENSE.txt
          Compress-Archive -Path dist\$dir\* -DestinationPath "$dir.zip"
          $hash = (Get-FileHash -Path "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dir.zip" | Out-File -FilePath "$dir.zip.sha256" -Encoding ASCII

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhylaRAM-${{ steps.version.outputs.VERSION }}-x64-TEST-SIGNED.zip
            PhylaRAM-${{ steps.version.outputs.VERSION }}-x64-TEST-SIGNED.zip.sha256
          draft: true
          prerelease: true
          name: PhylaRAM ${{ github.ref_name }} (pre-release)
          body: |
            ## ⚠️ Pre-release — TEST-SIGNED binaries

            This is a pre-release build. The driver (`phylaram.sys`) is test-signed with a self-signed certificate.
            To load the driver, you must enable test-signing mode: `bcdedit /set testsigning on` (reboot required).

            See [CHANGELOG.md](CHANGELOG.md) for details.

            **This build has NOT been validated on physical hardware.**
