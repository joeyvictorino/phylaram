name: PhylaRAM Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver & CLI (Release | x64)
        run: |
          msbuild PhylaRAM.sln /p:Configuration=Release /p:Platform=x64 /p:WarningLevel=4 /p:TreatWarningAsError=true /v:minimal /m

      - name: Build Rust Offline Verifier
        working-directory: tools/phylaram-verify
        run: |
          cargo build --release
          copy target\release\phylaram-verify.exe ..\..\bin\phylaram-verify.exe

      - name: Assemble Release Bundle
        run: |
          mkdir dist\PhylaRAM-v1.0-x64
          copy bin\phylaram.exe dist\PhylaRAM-v1.0-x64\
          copy bin\phylaram-verify.exe dist\PhylaRAM-v1.0-x64\
          copy README.md dist\PhylaRAM-v1.0-x64\README.txt
          copy LICENSE dist\PhylaRAM-v1.0-x64\LICENSE.txt
          Compress-Archive -Path dist\PhylaRAM-v1.0-x64\* -DestinationPath PhylaRAM-v1.0-x64.zip

      - name: Generate SHA-256 Checksum
        run: |
          $hash = (Get-FileHash -Path PhylaRAM-v1.0-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  PhylaRAM-v1.0-x64.zip" | Out-File -FilePath PhylaRAM-v1.0-x64.zip.sha256 -Encoding ASCII

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhylaRAM-v1.0-x64.zip
            PhylaRAM-v1.0-x64.zip.sha256
          draft: false
          prerelease: false
          name: PhylaRAM v1.0 — Live RAM Capture for Windows
          body: |
            ## PhylaRAM v1.0 — Live Physical Memory Acquisition for Windows

            > *A love letter to the DFIR community. Born out of working a live incident response case where we needed the right tool immediately, only to sit and wait for vendor sales reps because traditional tools were trapped behind registration forms and sales funnels.*

            ### Highlights
            - **Single Standalone Executable:** `phylaram.exe` with embedded signed KMDF driver `phylaram.sys`.
            - **Strict Physical Addressing:** `file offset == physical address` with NTFS/ReFS sparse allocation.
            - **Forensic Truth (`UNREADABLE != ZERO`):** Preserves partial transfers and isolates bad pages at 4 KiB with NTSTATUS in `memory.raw.map.json`.
            - **Live Ring 0 Kernel Hints:** Embeds `CR3`, `KPCR`, `NT Base`, and VBS status in `phylaram-map-2` for instant Volatility 3 and MemProcFS analysis.
            - **Bandwidth Throttling & Cloud Streaming:** `--rate-limit <MB/s>` and direct stdout streaming (`-`).
            - **Multi-Drive Pagefile Discovery:** `--with-pagefile` captures locked `pagefile.sys` and `swapfile.sys` across all drives.
            - **Microsoft WinDbg 64-bit Dump Format:** `--dmp` generates companion crash dump header.
            - **Independent Rust Verifier:** `phylaram-verify.exe` for automated chain-of-custody verification.
