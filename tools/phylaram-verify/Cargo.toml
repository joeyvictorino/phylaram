[package]
name = "phylaram-verify"
version = "1.0.0"
edition = "2021"
authors = ["PhylaRAM Contributors"]
description = "Independent offline verification tool for PhylaRAM raw memory images and provenance sidecars"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
